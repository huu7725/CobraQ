services:
  # CobraQ Backend API + Static Frontend (served by FastAPI)
  - type: web
    name: cobraq
    runtime: docker
    plan: free  # Free tier: 512MB RAM, 0.1 CPU. Có thể upgrade lên 'starter' ($7/mo) nếu cần tốc độ.
    region: oregon  # Hoặc singapore (gần VN hơn), frankfurt, ohio
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health
    autoDeploy: true  # Tự động deploy khi push lên GitHub

    # Env vars (set trong dashboard Render → Environment, không commit secret!)
    envVars:
      - key: PYTHONUNBUFFERED
        value: "1"
      # DATABASE_URL — Postgres connection string from Neon.
      # Set this in Render Dashboard → Environment (NOT in this file).
      # Format: postgresql://user:pass@host/db?sslmode=require
      # Leave unset locally to fall back to SQLite.
      - key: DATA_DIR
        value: /app/data
      - key: PORT
        value: "10000"  # Render mặc định là 10000 (overwrite Dockerfile port)
      - key: DEBUG
        value: "false"
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      # 🔐 Secrets — đặt trong Render Dashboard, KHÔNG commit:
      # - DATABASE_URL (Neon Postgres connection string)
      # - GROK_API_KEY (primary AI — Grok xAI)
      # - SECRET_KEY (JWT signing)
      # - ANTHROPIC_API_KEY (optional — chỉ cần nếu upload PDF scan cần vision)

    # Persistent disk (chỉ áp dụng cho paid plan; free không có)
    # disk:
    #   name: cobraq-data
    #   mountPath: /app/data
    #   sizeGB: 1